name: Rebase verify

on:
  push:
    branches:
      - feat/jina-clip-embeddings
    paths:
      - pyproject.toml
      - uv.lock
      - src/winston/**
      - tests/src/winston/**
      - scripts/stream_recorder/**
      - tests/scripts/stream_recorder/**
      - .github/workflows/rebase-verify.yml
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - src/winston/**
      - tests/src/winston/**
      - scripts/stream_recorder/**
      - tests/scripts/stream_recorder/**
      - .github/workflows/rebase-verify.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jina-clip-embeddings

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Regenerate combined lock
        run: uv lock

      - name: Install combined environment
        run: uv sync --locked --all-extras

      - name: Run Winston and recorder tests
        run: uv run python -m pytest -q tests/src/winston tests/scripts/stream_recorder

      - name: Compile Python sources
        run: uv run python -m compileall -q src/winston scripts/stream_recorder

      - name: Commit lock and verification marker
        if: github.event_name == 'push'
        run: |
          printf '%s\n' 'result=success' 'tests=tests/src/winston + tests/scripts/stream_recorder' 'compileall=success' > .rebase-verify-success
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock .rebase-verify-success
          git commit -m 'ci: record rebased verification' || true
          git push
