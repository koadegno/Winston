name: Stream recorder

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/stream-recorder.yml'
  pull_request:
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/stream-recorder.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and script dependencies
        run: python -m pip install -e '.[script]'
      - name: Run unit and local integration tests
        run: python -m pytest tests/scripts/stream_recorder -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Discover Brussels and Prijedor HLS webcams
        shell: bash
        run: |
          set -euo pipefail

          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://www.brussels.be/webcam-grand-place' \
            --candidates-only \
            > /tmp/brussels.json &
          brussels_pid=$!

          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://www.prijedorgrad.org/sr-BA/gradsko-oko-live.html' \
            --candidates-only \
            > /tmp/prijedor.json &
          prijedor_pid=$!

          wait "$brussels_pid"
          wait "$prijedor_pid"

          cat /tmp/brussels.json
          cat /tmp/prijedor.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          brussels = json.loads(Path('/tmp/brussels.json').read_text())['candidates']
          prijedor = json.loads(Path('/tmp/prijedor.json').read_text())['candidates']

          assert brussels, 'No .m3u8 candidate discovered from Brussels Grand Place'
          assert any(urlparse(url).hostname == 'livecam.brucity.be' for url in brussels), brussels

          ipcamlive = {
              url for url in prijedor
              if (urlparse(url).hostname or '').endswith('ipcamlive.com')
          }
          assert len(ipcamlive) >= 2, prijedor

          print(f'brussels_m3u8={len(brussels)}')
          print(f'prijedor_ipcamlive_m3u8={len(ipcamlive)}')
          PY
      - name: Diagnose Sittard Czersk and Debica players
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          targets = [
              ('sittard', 'https://webcamsittard.nl/index.php/nl/camera1'),
              ('czersk', 'https://czersk.pl/strona/552-kamera-line'),
              ('debica', 'https://www.kamery24.org/i24/index.php/test/82-debica-rynek'),
          ]
          interesting = ('.m3u8', 'camstreamer', 'stream360', 'kamery24', 'online2.')

          async def inspect(context, name, url):
              print(f'===== {name.upper()} =====')
              page = await context.new_page()
              requests = []

              def collect(request):
                  lowered = request.url.lower()
                  if any(token in lowered for token in interesting):
                      requests.append(request.url)
                      print(f'REQUEST {request.resource_type}: {request.url}')

              page.on('request', collect)
              try:
                  await page.goto(url, wait_until='domcontentloaded', timeout=15_000)
              except Exception as exc:
                  print(f'GOTO ERROR: {type(exc).__name__}: {exc}')
              await page.wait_for_timeout(4_000)

              print('FRAMES BEFORE CLICK')
              for index, frame in enumerate(page.frames):
                  print(f'FRAME {index}: {frame.url}')
                  try:
                      print(f'  videos={await frame.locator("video").count()}')
                  except Exception as exc:
                      print(f'  inspect-error={type(exc).__name__}: {exc}')

              try:
                  iframe_srcs = await page.locator('iframe').evaluate_all(
                      "els => els.map(e => e.src || e.getAttribute('src'))"
                  )
                  print(f'IFRAMES={iframe_srcs}')
              except Exception as exc:
                  print(f'IFRAME ERROR: {type(exc).__name__}: {exc}')

              for index, frame in enumerate(page.frames):
                  for selector in (
                      'button.vjs-big-play-button',
                      '.vjs-big-play-button',
                      "button[aria-label*='Play']",
                      "button[title*='Play']",
                      'video',
                  ):
                      try:
                          locator = frame.locator(selector).first
                          if await locator.count() and await locator.is_visible():
                              print(f'CLICK frame={index} selector={selector}')
                              await locator.click(timeout=2_000, force=True)
                              break
                      except Exception as exc:
                          print(f'CLICK ERROR frame={index} selector={selector}: {type(exc).__name__}: {exc}')
                  await page.wait_for_timeout(1_000)

              await page.wait_for_timeout(4_000)
              m3u8 = sorted({item for item in requests if '.m3u8' in item.lower()})
              print(f'M3U8 COUNT={len(m3u8)}')
              for item in m3u8:
                  print(f'M3U8 {item}')
              await page.close()

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  context = await browser.new_context(ignore_https_errors=True)
                  for name, url in targets:
                      await inspect(context, name, url)
                  await context.close()
                  await browser.close()

          asyncio.run(main())
          PY
