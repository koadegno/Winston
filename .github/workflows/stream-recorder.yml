name: Stream recorder

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - '.github/workflows/stream-recorder.yml'
  pull_request:
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - '.github/workflows/stream-recorder.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pytest pyxlsb playwright
      - name: Run unit and local integration tests
        run: python -m pytest tests/scripts/stream_recorder -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Discover Brussels Grand Place HLS webcam
        run: |
          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://www.brussels.be/webcam-grand-place' \
            --candidates-only \
            > /tmp/discovery.json
          cat /tmp/discovery.json
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          result = json.loads(Path('/tmp/discovery.json').read_text())
          candidates = result['candidates']
          assert candidates, 'No .m3u8 candidate discovered from the Brussels Grand Place webcam'
          assert all('.m3u8' in url.lower() for url in candidates)
          assert any(urlparse(url).hostname == 'livecam.brucity.be' for url in candidates), candidates
          print(f"discovered_m3u8={len(candidates)}")
          PY
