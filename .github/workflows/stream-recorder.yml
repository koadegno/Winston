name: Stream recorder

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - '.github/workflows/stream-recorder.yml'
  pull_request:
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - '.github/workflows/stream-recorder.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pytest pyxlsb playwright
      - name: Run unit and local integration tests
        run: python -m pytest tests/scripts/stream_recorder -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Diagnose real public webcam discovery layers
        run: |
          set +e
          timeout 30s python -u - <<'PY'
          from scripts.stream_recorder.discovery import discover_http
          url = 'https://webcamsittard.nl/'
          print('HTTP_START', flush=True)
          print(sorted(discover_http(url)), flush=True)
          print('HTTP_DONE', flush=True)
          PY
          echo "HTTP_RC=$?"

          timeout 30s python -u - <<'PY'
          from scripts.stream_recorder.discovery import discover_browser
          url = 'https://webcamsittard.nl/'
          print('BROWSER_START', flush=True)
          print(sorted(discover_browser(url)), flush=True)
          print('BROWSER_DONE', flush=True)
          PY
          echo "BROWSER_RC=$?"
          exit 1
