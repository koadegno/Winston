name: Stream recorder

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - 'Place_Overview.csv'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/stream-recorder.yml'
  pull_request:
    paths:
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - 'Place_Overview.csv'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/stream-recorder.yml'
  workflow_dispatch:

jobs:
  apply-delayed-hls-grace:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-stream-recorder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply delayed HLS grace when needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/stream_recorder/discovery.py')
          text = path.read_text()
          marker = 'media controls not ready; waiting for delayed HLS initialization'
          if marker in text:
              print('Delayed HLS grace is already implemented.')
              raise SystemExit(0)

          old = '''            if not streams:
              log(f"{prefix} no HLS after initial load; trying user-gesture media activation")
              # Real third-party players can explicitly require a user gesture. Try visible play
              # controls first; only use HTMLMediaElement.play() if the click path produced no HLS.
              clicked = await _click_play_controls(page, prefix, deadline)
              if clicked and not streams:
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              if not streams:
                  attempted = await _activate_video_elements(page, prefix, deadline)
                  if attempted and not streams:
                      await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
'''
          new = '''            if not streams:
              log(f"{prefix} no HLS after initial load; trying user-gesture media activation")
              # Real third-party players can explicitly require a user gesture. Try visible play
              # controls first; only use HTMLMediaElement.play() if the click path produced no HLS.
              clicked = await _click_play_controls(page, prefix, deadline)
              if clicked and not streams:
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              attempted = False
              if not streams:
                  attempted = await _activate_video_elements(page, prefix, deadline)
                  if attempted and not streams:
                      await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              if not streams and not clicked and not attempted:
                  # Some players attach their video/control asynchronously after DOMContentLoaded.
                  # Even when there is nothing to activate yet, keep the source page alive for one
                  # bounded grace window so late network HLS requests are not missed.
                  log(f"{prefix} media controls not ready; waiting for delayed HLS initialization")
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
'''
          if old not in text:
              raise SystemExit('expected media activation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install project dependencies
        run: python -m pip install -e '.[script]'
      - name: Verify delayed HLS regression
        run: python -m pytest tests/scripts/stream_recorder/test_czersk_activation.py::test_browser_waits_for_delayed_hls_when_player_controls_are_not_ready -q
      - name: Commit implementation when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/stream_recorder/discovery.py; then
            echo 'No production change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stream_recorder/discovery.py
          git commit -m 'fix: wait for delayed player HLS initialization'
          git push origin HEAD:feat/public-stream-recorder

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and script dependencies
        run: python -m pip install -e '.[script]'
      - name: Run unit and local integration tests
        run: python -m pytest tests/scripts/stream_recorder -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Discover Brussels and Prijedor HLS webcams
        shell: bash
        run: |
          set -euo pipefail

          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://www.brussels.be/webcam-grand-place' \
            --candidates-only \
            > /tmp/brussels.json &
          brussels_pid=$!

          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://www.prijedorgrad.org/sr-BA/gradsko-oko-live.html' \
            --candidates-only \
            > /tmp/prijedor.json &
          prijedor_pid=$!

          wait "$brussels_pid"
          wait "$prijedor_pid"

          cat /tmp/brussels.json
          cat /tmp/prijedor.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          brussels = json.loads(Path('/tmp/brussels.json').read_text())['candidates']
          prijedor = json.loads(Path('/tmp/prijedor.json').read_text())['candidates']

          assert brussels, 'No .m3u8 candidate discovered from Brussels Grand Place'
          assert any(urlparse(url).hostname == 'livecam.brucity.be' for url in brussels), brussels

          ipcamlive = {
              url for url in prijedor
              if (urlparse(url).hostname or '').endswith('ipcamlive.com')
          }
          assert len(ipcamlive) >= 2, prijedor

          print(f'brussels_m3u8={len(brussels)}')
          print(f'prijedor_ipcamlive_m3u8={len(ipcamlive)}')
          PY

      - name: Verify Czersk and Debica real targets
        shell: bash
        run: |
          set -euo pipefail

          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://czersk.pl/strona/552-kamera-line' \
            --candidates-only \
            > /tmp/czersk.json &
          czersk_pid=$!

          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://www.kamery24.org/i24/index.php/test/82-debica-rynek' \
            > /tmp/debica.json &
          debica_pid=$!

          wait "$czersk_pid"
          wait "$debica_pid"

          cat /tmp/czersk.json
          cat /tmp/debica.json

          python - <<'PY'
          import json
          from pathlib import Path

          czersk = json.loads(Path('/tmp/czersk.json').read_text())
          debica = json.loads(Path('/tmp/debica.json').read_text())

          czersk_url = 'https://7005.szczecin.pl/camss/streams/czersk.m3u8'
          debica_url = 'https://online2.kamery24.org/cam/debica.m3u8'

          assert czersk_url in czersk['candidates'], czersk
          assert debica_url in debica['candidates'], debica
          assert debica['cameras'], debica

          print(f"czersk_m3u8={len(czersk['candidates'])}")
          print(f"debica_cameras={len(debica['cameras'])}")
          PY

      - name: Verify Boccadasse through the normal recorder discovery path
        shell: bash
        run: |
          set -euo pipefail

          timeout 90s python -m scripts.stream_recorder.main discover \
            --url 'https://www.skylinewebcams.com/en/webcam/italia/liguria/genova/boccadasse-genova.html' \
            > /tmp/boccadasse.json

          cat /tmp/boccadasse.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          payload = json.loads(Path('/tmp/boccadasse.json').read_text())
          candidates = payload['candidates']
          assert any(
              urlparse(url).hostname == 'hd-auth.skylinewebcams.com'
              for url in candidates
          ), payload
          assert payload['cameras'], payload

          print(f"boccadasse_candidates={len(candidates)}")
          print(f"boccadasse_cameras={len(payload['cameras'])}")
          PY
