name: Stream recorder missed-camera debug

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - '.github/workflows/stream-recorder-missed-camera-debug.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          python -m pip install 'playwright>=1.62.0'
          python -m playwright install --with-deps chromium
      - name: Inspect Sittard Czersk and Debica players
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          TARGETS = [
              ("sittard", "https://webcamsittard.nl/index.php/nl/camera1"),
              ("czersk", "https://czersk.pl/strona/552-kamera-line"),
              ("debica", "https://www.kamery24.org/i24/index.php/test/82-debica-rynek"),
          ]
          INTERESTING = (".m3u8", "camstreamer", "stream360", "kamery24", "online2.")

          async def inspect(context, name, url):
              print(f"\n===== {name.upper()} {url} =====")
              page = await context.new_page()
              requests = []

              def on_request(request):
                  req_url = request.url
                  if any(token in req_url.lower() for token in INTERESTING):
                      requests.append(req_url)
                      print(f"REQUEST {request.resource_type}: {req_url}")

              page.on("request", on_request)
              try:
                  await page.goto(url, wait_until="domcontentloaded", timeout=15_000)
              except Exception as exc:
                  print(f"GOTO ERROR: {type(exc).__name__}: {exc}")

              await page.wait_for_timeout(4_000)
              print("FRAMES BEFORE CLICK:")
              for frame in page.frames:
                  print(f"  {frame.url}")

              try:
                  iframe_srcs = await page.locator("iframe").evaluate_all(
                      "els => els.map(e => e.src || e.getAttribute('src'))"
                  )
                  print(f"IFRAMES: {iframe_srcs}")
              except Exception as exc:
                  print(f"IFRAME INSPECT ERROR: {type(exc).__name__}: {exc}")

              for idx, frame in enumerate(page.frames):
                  try:
                      videos = await frame.locator("video").count()
                      sources = await frame.locator("source").count()
                      print(f"FRAME {idx} VIDEO_COUNT={videos} SOURCE_COUNT={sources} URL={frame.url}")
                      if videos:
                          video_data = await frame.locator("video").evaluate_all(
                              "els => els.map(e => ({src:e.src,currentSrc:e.currentSrc,paused:e.paused,autoplay:e.autoplay,muted:e.muted}))"
                          )
                          print(f"FRAME {idx} VIDEOS={video_data}")
                  except Exception as exc:
                      print(f"FRAME {idx} INSPECT ERROR: {type(exc).__name__}: {exc}")

              print("ATTEMPT PLAY INTERACTION")
              for idx, frame in enumerate(page.frames):
                  for selector in (
                      "button.vjs-big-play-button",
                      ".vjs-big-play-button",
                      "button[aria-label*='Play']",
                      "button[title*='Play']",
                      "video",
                  ):
                      try:
                          locator = frame.locator(selector).first
                          if await locator.count() and await locator.is_visible():
                              print(f"CLICK frame={idx} selector={selector}")
                              await locator.click(timeout=2_000, force=True)
                              await page.wait_for_timeout(2_000)
                              break
                      except Exception as exc:
                          print(f"CLICK ERROR frame={idx} selector={selector}: {type(exc).__name__}: {exc}")

              await page.wait_for_timeout(4_000)
              print("FRAMES AFTER CLICK:")
              for frame in page.frames:
                  print(f"  {frame.url}")
              m3u8 = sorted({u for u in requests if '.m3u8' in u.lower()})
              print(f"M3U8 COUNT={len(m3u8)}")
              for candidate in m3u8:
                  print(f"M3U8 {candidate}")
              await page.close()

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  context = await browser.new_context(ignore_https_errors=True)
                  for name, url in TARGETS:
                      await inspect(context, name, url)
                  await context.close()
                  await browser.close()

          asyncio.run(main())
          PY
