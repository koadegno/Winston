name: Stream recorder Boccadasse debug

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - '.github/workflows/stream-recorder-boccadasse-debug.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          python -m pip install 'playwright>=1.62.0'
          python -m playwright install --with-deps chromium
      - name: Inspect Boccadasse for 20 seconds after playback gesture
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          URL = 'https://www.skylinewebcams.com/en/webcam/italia/liguria/genova/boccadasse-genova.html'

          async def main() -> None:
              """Observe Boccadasse network/video state well beyond the production settle window."""
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(headless=True)
                  context = await browser.new_context()
                  page = await context.new_page()
                  m3u8 = set()

                  def on_request(request) -> None:
                      """Print media/provider requests while collecting HLS URLs."""
                      lowered = request.url.lower()
                      if '.m3u8' in lowered:
                          m3u8.add(request.url)
                      if '.m3u8' in lowered or 'skyline' in lowered or request.resource_type == 'media':
                          print(f'REQUEST {request.resource_type}: {request.url}')

                  def on_response(response) -> None:
                      """Surface failed Skyline/HLS responses that explain missing playback."""
                      lowered = response.url.lower()
                      if response.status >= 400 and ('.m3u8' in lowered or 'skyline' in lowered):
                          print(f'RESPONSE {response.status}: {response.url}')

                  page.on('request', on_request)
                  page.on('response', on_response)
                  await page.goto(URL, wait_until='domcontentloaded', timeout=20_000)
                  await page.wait_for_timeout(4_000)

                  videos = page.locator('video')
                  count = await videos.count()
                  print(f'VIDEO_COUNT={count}')
                  if count:
                      print('VIDEO_BEFORE=', await videos.evaluate_all(
                          "els => els.map(v => ({src:v.src,currentSrc:v.currentSrc,paused:v.paused,readyState:v.readyState,error:v.error && v.error.code}))"
                      ))
                      await videos.first.click(force=True, timeout=2_000)
                      print('CLICKED_VIDEO')

                  for seconds in (2, 5, 10, 20):
                      previous = 0 if seconds == 2 else {2: 2, 5: 5, 10: 10}[seconds]
                      await page.wait_for_timeout((seconds - previous) * 1_000)
                      print(f'AFTER_{seconds}S_M3U8={sorted(m3u8)}')
                      if count:
                          print(f'VIDEO_AFTER_{seconds}S=', await videos.evaluate_all(
                              "els => els.map(v => ({src:v.src,currentSrc:v.currentSrc,paused:v.paused,readyState:v.readyState,error:v.error && v.error.code}))"
                          ))

                  print(f'FINAL_M3U8_COUNT={len(m3u8)}')
                  await page.close()
                  await context.close()
                  await browser.close()

          asyncio.run(main())
          PY
