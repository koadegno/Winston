name: Stream recorder full discovery

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - '.github/workflows/stream-recorder-full-discovery.yml'
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - 'Place_Overview.csv'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/stream-recorder-full-discovery.yml'
      - 'scripts/stream_recorder/**'
      - 'tests/scripts/stream_recorder/**'
      - 'Place_Overview.csv'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

concurrency:
  group: stream-recorder-full-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-delayed-hls-grace:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-stream-recorder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply delayed HLS grace when needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/stream_recorder/discovery.py')
          text = path.read_text()
          marker = 'media controls not ready; waiting for delayed HLS initialization'
          if marker in text:
              print('Delayed HLS grace is already implemented.')
              raise SystemExit(0)

          old = '''            if not streams:
              log(f"{prefix} no HLS after initial load; trying user-gesture media activation")
              # Real third-party players can explicitly require a user gesture. Try visible play
              # controls first; only use HTMLMediaElement.play() if the click path produced no HLS.
              clicked = await _click_play_controls(page, prefix, deadline)
              if clicked and not streams:
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              if not streams:
                  attempted = await _activate_video_elements(page, prefix, deadline)
                  if attempted and not streams:
                      await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
'''
          new = '''            if not streams:
              log(f"{prefix} no HLS after initial load; trying user-gesture media activation")
              # Real third-party players can explicitly require a user gesture. Try visible play
              # controls first; only use HTMLMediaElement.play() if the click path produced no HLS.
              clicked = await _click_play_controls(page, prefix, deadline)
              if clicked and not streams:
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              attempted = False
              if not streams:
                  attempted = await _activate_video_elements(page, prefix, deadline)
                  if attempted and not streams:
                      await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              if not streams and not clicked and not attempted:
                  # Some players attach their video/control asynchronously after DOMContentLoaded.
                  # Even when there is nothing to activate yet, keep the source page alive for one
                  # bounded grace window so late network HLS requests are not missed.
                  log(f"{prefix} media controls not ready; waiting for delayed HLS initialization")
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
'''
          if old not in text:
              raise SystemExit('expected media activation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install project dependencies
        run: python -m pip install -e '.[script]'
      - name: Verify delayed HLS regression
        run: python -m pytest tests/scripts/stream_recorder/test_czersk_activation.py::test_browser_waits_for_delayed_hls_when_player_controls_are_not_ready -q
      - name: Commit implementation when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/stream_recorder/discovery.py; then
            echo 'No production change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stream_recorder/discovery.py
          git commit -m 'fix: wait for delayed player HLS initialization'
          git push origin HEAD:feat/public-stream-recorder

  full-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project and script dependencies
        run: python -m pip install -e '.[script]'

      - name: Run stream recorder regression tests
        run: python -m pytest tests/scripts/stream_recorder -q

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify repository Place Overview CSV
        shell: bash
        run: |
          set -euo pipefail
          test -f Place_Overview.csv
          wc -l Place_Overview.csv
          head -n 2 Place_Overview.csv

      - name: Discover every enabled non-YouTube source from the CSV
        shell: bash
        run: |
          set -euo pipefail

          started=$(date +%s)
          timeout 10m python -m scripts.stream_recorder.main discover \
            --sources Place_Overview.csv \
            --browser-concurrency 4 \
            > /tmp/full-discovery.json \
            2> >(tee /tmp/full-discovery.log >&2)
          finished=$(date +%s)
          echo "full_discovery_seconds=$((finished - started))"

      - name: Validate complete discovery result
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          payload = json.loads(Path('/tmp/full-discovery.json').read_text())
          assert isinstance(payload, list), type(payload)
          assert len(payload) == 34, f'Expected 34 enabled non-YouTube sources, got {len(payload)}'

          by_id = {str((item.get('source') or {}).get('id')): item for item in payload}
          assert '61' not in by_id, 'Sittard must stay disabled while its player is YouTube-backed'
          for source_id in ('90-1', '90-2', '90-3', '90-4', '90-5', '90-6', '131', '132', '133'):
              assert source_id in by_id, f'Missing configured source {source_id}'

          errors = [item for item in payload if item.get('error')]
          with_candidates = [item for item in payload if item.get('candidates')]
          candidate_urls = [
              url
              for item in payload
              for url in item.get('candidates', [])
          ]
          camera_count = sum(len(item.get('cameras', [])) for item in payload)
          blocked_suffixes = (
              'facebook.com',
              'fbcdn.net',
              'google.com',
              'googleapis.com',
              'google-analytics.com',
              'googleadservices.com',
              'googlesyndication.com',
              'googletagmanager.com',
              'gstatic.com',
              'doubleclick.net',
              'youtube.com',
              'youtu.be',
              'googlevideo.com',
          )

          def blocked(url: str) -> bool:
              host = (urlparse(url).hostname or '').lower()
              return any(host == suffix or host.endswith('.' + suffix) for suffix in blocked_suffixes)

          blocked_urls = [url for url in candidate_urls if blocked(url)]
          assert with_candidates, 'The full CSV run discovered no HLS candidates'
          assert not blocked_urls, f'Blocked service URLs leaked into HLS candidates: {blocked_urls}'

          czersk_url = 'https://7005.szczecin.pl/camss/streams/czersk.m3u8'
          debica_url = 'https://online2.kamery24.org/cam/debica.m3u8'
          assert czersk_url in by_id['112'].get('candidates', []), by_id['112']
          assert debica_url in by_id['113'].get('candidates', []), by_id['113']
          assert by_id['113'].get('cameras'), by_id['113']

          boccadasse_candidates = by_id['133'].get('candidates', [])
          assert any(
              urlparse(url).hostname == 'hd-auth.skylinewebcams.com'
              for url in boccadasse_candidates
          ), by_id['133']
          assert by_id['133'].get('cameras'), by_id['133']

          print(f'sources_total={len(payload)}')
          print(f'sources_with_candidates={len(with_candidates)}')
          print(f'sources_with_errors={len(errors)}')
          print(f'hls_candidates_total={len(candidate_urls)}')
          print(f'logical_cameras_total={camera_count}')

          print('New source coverage:')
          for source_id in ('90-1', '90-2', '90-3', '90-4', '90-5', '90-6', '131', '132', '133'):
              item = by_id[source_id]
              print(
                  f"- {source_id}: candidates={len(item.get('candidates', []))} "
                  f"cameras={len(item.get('cameras', []))} error={item.get('error') or '-'}"
              )

          if errors:
              print('Sources with errors:')
              for item in errors:
                  source = item.get('source') or {}
                  print(f"- {source.get('id')} {source.get('place')}: {item.get('error')}")
          PY

      - name: Print compact source summary
        if: always()
        shell: bash
        run: |
          if [ -s /tmp/full-discovery.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/full-discovery.json').read_text())
          for item in payload:
              source = item.get('source') or {}
              print(
                  f"{source.get('id')} | {source.get('country')} | {source.get('city')} | "
                  f"{source.get('place')} | candidates={len(item.get('candidates', []))} | "
                  f"cameras={len(item.get('cameras', []))} | error={item.get('error') or '-'}"
              )
          PY
          fi

      - name: Upload full discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-recorder-full-discovery
          if-no-files-found: warn
          path: |
            /tmp/full-discovery.json
            /tmp/full-discovery.log
