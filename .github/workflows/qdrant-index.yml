name: Qdrant visual index

on:
  pull_request:
    paths:
      - 'src/winston/index/**'
      - 'src/winston/ingest/identity.py'
      - 'src/winston/sampling/**'
      - 'src/winston/config.py'
      - 'tests/src/winston/index/**'
      - 'tests/src/winston/ingest/test_identity.py'
      - 'tests/src/winston/sampling/test_images.py'
      - 'tests/src/winston/test_config.py'
      - 'tests/integration/test_qdrant_visual_index.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/qdrant-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify lockfile
        run: uv lock --check
      - name: Install focused test dependencies
        run: |
          python -m pip install \
            'numpy>=2.3.0' \
            'pillow>=12.0.0' \
            'pydantic>=2.13.4' \
            'pydantic-settings>=2.15.0' \
            'pytest>=9.1.1' \
            'pytest-asyncio>=1.4.0' \
            'qdrant-client==1.18.0'
          python -m pip install -e . --no-deps
      - name: Wait for Qdrant 1.18.2
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:6333/collections >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Qdrant did not become ready on port 6333' >&2
          exit 1
      - name: Run Phase 1E focused unit tests
        run: >-
          python -m pytest -q
          tests/src/winston/test_config.py
          tests/src/winston/ingest/test_identity.py
          tests/src/winston/sampling/test_images.py
          tests/src/winston/index
      - name: Run real Qdrant integration tests
        run: python -m pytest -q tests/integration/test_qdrant_visual_index.py
      - name: Compile Winston source
        run: python -m compileall -q src/winston
