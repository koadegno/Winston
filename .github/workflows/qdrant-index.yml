name: Qdrant visual index

on:
  pull_request:
    paths:
      - 'src/winston/index/**'
      - 'src/winston/ingest/identity.py'
      - 'src/winston/config.py'
      - 'tests/src/winston/index/**'
      - 'tests/src/winston/ingest/test_identity.py'
      - 'tests/src/winston/test_config.py'
      - 'tests/integration/test_qdrant_visual_index.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/qdrant-index.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test dependencies
        run: |
          python -m pip install \
            'numpy>=2.3.0' \
            'pydantic>=2.13.4' \
            'pydantic-settings>=2.15.0' \
            'pytest>=9.1.1' \
            'pytest-asyncio>=1.4.0'
          python -m pip install -e . --no-deps
      - name: Run Phase 1D configuration tests
        run: python -m pytest -q tests/src/winston/test_config.py
