name: Qdrant visual index

on:
  pull_request:
    paths:
      - 'src/winston/index/**'
      - 'src/winston/ingest/identity.py'
      - 'src/winston/config.py'
      - 'tests/src/winston/index/**'
      - 'tests/src/winston/ingest/test_identity.py'
      - 'tests/src/winston/test_config.py'
      - 'tests/integration/test_qdrant_visual_index.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/qdrant-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Refresh lockfile when dependency metadata changed
        if: github.event_name == 'pull_request'
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add uv.lock
            git commit -m 'chore: refresh uv lockfile'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install focused test dependencies
        run: |
          python -m pip install \
            'numpy>=2.3.0' \
            'pydantic>=2.13.4' \
            'pydantic-settings>=2.15.0' \
            'pytest>=9.1.1' \
            'pytest-asyncio>=1.4.0' \
            'qdrant-client>=1.18,<1.19'
          python -m pip install -e . --no-deps
      - name: Run Phase 1D configuration tests
        run: python -m pytest -q tests/src/winston/test_config.py
