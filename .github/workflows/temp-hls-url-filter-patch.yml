name: Temporary HLS URL filter patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-hls-url-filter-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-stream-recorder
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Patch HLS URL validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/stream_recorder/discovery.py')
          text = path.read_text(encoding='utf-8')

          old_token = '''    raw = _normalize_escaped_url(text[left:right]).strip()\n    lowered = raw.lower()\n    http_position = max(lowered.rfind("https://"), lowered.rfind("http://"))\n'''
          new_token = '''    raw = _normalize_escaped_url(text[left:right]).strip()\n    lowered = raw.lower()\n    # URL-encoded absolute URLs commonly appear as telemetry/query metadata. Static\n    # extraction must not turn those values into fake relative HLS resources.\n    if lowered.startswith(("http%3a%2f%2f", "https%3a%2f%2f")):\n        return ""\n    http_position = max(lowered.rfind("https://"), lowered.rfind("http://"))\n'''
          if old_token not in text:
              raise SystemExit('target token extraction block not found')
          text = text.replace(old_token, new_token, 1)

          old_validation = '''    if _HLS_MARKER not in url.lower():\n        return False\n    return not any(_host_matches_suffix(host, suffix) for suffix in _BLOCKED_STREAM_HOST_SUFFIXES)\n'''
          new_validation = '''    # The requested resource itself must be an HLS playlist. Telemetry endpoints can\n    # legitimately contain an encoded ``.m3u8`` URL in their query string, but that\n    # does not make the telemetry request an HLS candidate.\n    if not parsed.path.lower().endswith(_HLS_MARKER):\n        return False\n    return not any(_host_matches_suffix(host, suffix) for suffix in _BLOCKED_STREAM_HOST_SUFFIXES)\n'''
          if old_validation not in text:
              raise SystemExit('target HLS validation block not found')
          text = text.replace(old_validation, new_validation, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[script]'

      - name: Run HLS URL regression tests
        run: python -m pytest tests/scripts/stream_recorder/test_hls_url_validation.py tests/scripts/stream_recorder/test_discovery.py -q

      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stream_recorder/discovery.py
          git commit -m 'fix: reject telemetry URLs containing embedded HLS links'
          git push origin HEAD:feat/public-stream-recorder
