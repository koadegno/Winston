name: Candidate provenance RED

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - '.github/workflows/candidate-provenance-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install script dependencies
        run: python -m pip install -e '.[script]'
      - name: Run candidate provenance tests
        run: python -m pytest tests/scripts/stream_recorder/test_candidate_provenance.py -q
