name: Apply semantic named-vector fix

on:
  pull_request:
    paths:
      - '.github/workflows/apply-semantic-named-vector-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-search-cli
      - name: Apply reviewed adapter change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/winston/index/qdrant.py')
          text = path.read_text()
          if 'with_vectors: bool,' not in text:
              raise SystemExit('query_points with_vectors annotation not found')
          if 'with_vectors=True,' not in text:
              raise SystemExit('coarse query with_vectors=True not found')
          text = text.replace('with_vectors: bool,', 'with_vectors: list[str],', 1)
          text = text.replace(
              'with_vectors=True,',
              'with_vectors=[self._settings.vector_name],',
              1,
          )
          path.write_text(text)
          PY
          git rm .github/workflows/apply-semantic-named-vector-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/winston/index/qdrant.py
          git commit -m 'fix: request only named visual vector'
          git push origin HEAD:feat/semantic-search-cli
