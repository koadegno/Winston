name: Apply semantic named-vector fix

on:
  pull_request:
    paths:
      - '.github/workflows/apply-semantic-named-vector-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-search-cli
      - name: Apply reviewed adapter change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/winston/index/qdrant.py')
          text = path.read_text()
          protocol_old = '''    async def query_points(
              self,
              collection_name: str,
              *,
              query: list[float],
              using: str,
              limit: int,
              with_payload: bool,
              with_vectors: bool,
          ) -> models.QueryResponse:
          '''
          protocol_new = protocol_old.replace('with_vectors: bool,', 'with_vectors: list[str],')
          query_old = '''            response = await self._client.query_points(
                  self._settings.collection,
                  query=query_vector.tolist(),
                  using=self._settings.vector_name,
                  limit=limit,
                  with_payload=True,
                  with_vectors=True,
              )
          '''
          query_new = query_old.replace(
              'with_vectors=True,',
              'with_vectors=[self._settings.vector_name],',
          )
          if protocol_old not in text:
              raise SystemExit('query_points protocol block not found')
          if query_old not in text:
              raise SystemExit('coarse query block not found')
          text = text.replace(protocol_old, protocol_new, 1)
          text = text.replace(query_old, query_new, 1)
          path.write_text(text)
          PY
          git rm .github/workflows/apply-semantic-named-vector-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/winston/index/qdrant.py
          git commit -m 'fix: request only named visual vector'
          git push origin HEAD:feat/semantic-search-cli
