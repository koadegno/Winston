name: Apply semantic named-vector fix

on:
  pull_request:
    paths:
      - '.github/workflows/apply-semantic-named-vector-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-search-cli
      - name: Apply reviewed adapter change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/winston/index/qdrant.py')
          lines = path.read_text().splitlines(keepends=True)

          protocol_changes = 0
          query_changes = 0

          for index, line in enumerate(lines):
              if line.strip() != 'async def query_points(':
                  continue
              for cursor in range(index + 1, min(index + 20, len(lines))):
                  stripped = lines[cursor].strip()
                  if stripped == 'with_vectors: bool,':
                      indent = lines[cursor][: len(lines[cursor]) - len(lines[cursor].lstrip())]
                      lines[cursor] = f'{indent}with_vectors: list[str],\n'
                      protocol_changes += 1
                      break
                  if stripped == ') -> models.QueryResponse:':
                      break
              break

          for index, line in enumerate(lines):
              if line.strip() != 'response = await self._client.query_points(':
                  continue
              for cursor in range(index + 1, min(index + 20, len(lines))):
                  stripped = lines[cursor].strip()
                  if stripped == 'with_vectors=True,':
                      indent = lines[cursor][: len(lines[cursor]) - len(lines[cursor].lstrip())]
                      lines[cursor] = f'{indent}with_vectors=[self._settings.vector_name],\n'
                      query_changes += 1
                      break
                  if stripped == ')':
                      break
              break

          if protocol_changes != 1:
              raise SystemExit(f'expected one query_points protocol edit, got {protocol_changes}')
          if query_changes != 1:
              raise SystemExit(f'expected one coarse query edit, got {query_changes}')

          path.write_text(''.join(lines))
          PY
          git rm .github/workflows/apply-semantic-named-vector-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/winston/index/qdrant.py
          git commit -m 'fix: request only named visual vector'
          git push origin HEAD:feat/semantic-search-cli
