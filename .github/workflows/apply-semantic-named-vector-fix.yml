name: Apply semantic named-vector fix

on:
  pull_request:
    paths:
      - '.github/workflows/apply-semantic-named-vector-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-search-cli
      - name: Apply reviewed adapter change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/winston/index/qdrant.py')
          text = path.read_text()

          text, protocol_count = re.subn(
              r'(async def query_points\([\s\S]*?with_payload: bool,\n\s*)with_vectors: bool,',
              r'\1with_vectors: list[str],',
              text,
              count=1,
          )
          text, query_count = re.subn(
              r'(response = await self\._client\.query_points\([\s\S]*?with_payload=True,\n\s*)with_vectors=True,',
              r'\1with_vectors=[self._settings.vector_name],',
              text,
              count=1,
          )
          if protocol_count != 1:
              raise SystemExit(f'expected one query_points protocol edit, got {protocol_count}')
          if query_count != 1:
              raise SystemExit(f'expected one coarse query edit, got {query_count}')
          path.write_text(text)
          PY
          git rm .github/workflows/apply-semantic-named-vector-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/winston/index/qdrant.py
          git commit -m 'fix: request only named visual vector'
          git push origin HEAD:feat/semantic-search-cli
