name: Rebase stream recorder branch

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - '.github/workflows/rebase-stream-recorder.yml'

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-stream-recorder
          fetch-depth: 0
      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:feat/public-stream-recorder
