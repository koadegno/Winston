name: Final full regression

on:
  push:
    branches:
      - feat/qdrant-visual-index

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run full Winston regression suite
        run: uv run python -m pytest -q tests/src/winston
      - name: Compile Winston source
        run: uv run python -m compileall -q src/winston
