name: Semantic search temporary validation

on:
  pull_request:
    branches:
      - feat/semantic-search-cli
    paths:
      - '.github/workflows/semantic-search-validation.yml'
      - 'tmp/semantic-search-validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install locked Winston environment
        run: uv sync --locked
      - name: Wait for Qdrant 1.18.2
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:6333/collections >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run full regression
        run: uv run python -m pytest -q
      - name: Compile Winston source
        run: uv run python -m compileall -q src/winston

  inspect-real-qdrant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qdrant client
        run: python -m pip install 'qdrant-client==1.18.0'
      - name: Start user-provided Qdrant volume
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name qdrant-real \
            -p 6333:6333 \
            -v "$PWD/volumes/qdrant:/qdrant/storage" \
            qdrant/qdrant:v1.18.2
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:6333/collections >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs qdrant-real
          exit 1
      - name: Inventory Winston visual collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          from dataclasses import dataclass, field
          from qdrant_client import AsyncQdrantClient

          @dataclass(slots=True)
          class SourceStats:
              points: int = 0
              media_type: str | None = None
              assets: set[str] = field(default_factory=set)
              min_ts: float | None = None
              max_ts: float | None = None

          async def main() -> None:
              client = AsyncQdrantClient(url='http://localhost:6333')
              try:
                  info = await client.get_collection('winston_visual')
                  count = await client.count('winston_visual', exact=True)
                  by_source: dict[str, SourceStats] = {}
                  offset = None
                  while True:
                      records, offset = await client.scroll(
                          'winston_visual',
                          limit=1000,
                          offset=offset,
                          with_payload=True,
                          with_vectors=False,
                      )
                      for record in records:
                          payload = record.payload or {}
                          source_value = payload.get('source_path')
                          source = source_value if isinstance(source_value, str) else '<missing>'
                          row = by_source.setdefault(source, SourceStats())
                          row.points += 1
                          media_value = payload.get('media_type')
                          if isinstance(media_value, str):
                              row.media_type = media_value
                          asset = payload.get('asset_id')
                          if isinstance(asset, str):
                              row.assets.add(asset)
                          timestamp = payload.get('timestamp_seconds')
                          if isinstance(timestamp, (int, float)):
                              value = float(timestamp)
                              row.min_ts = value if row.min_ts is None else min(row.min_ts, value)
                              row.max_ts = value if row.max_ts is None else max(row.max_ts, value)
                      if offset is None:
                          break

                  print('collection=winston_visual')
                  print(f'points={count.count}')
                  print(f'metadata={info.config.metadata}')
                  print('sources:')
                  for source in sorted(by_source):
                      row = by_source[source]
                      print(
                          f'- {source} | media={row.media_type} | points={row.points} '
                          f'| assets={len(row.assets)} | timestamp={row.min_ts}..{row.max_ts}'
                      )
              finally:
                  await client.close()

          asyncio.run(main())
          PY
      - name: Stop temporary Qdrant
        if: always()
        run: docker rm -f qdrant-real || true

  real-jina-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMBEDDING__ENGINE: jina-api
      EMBEDDING__API_KEY: ${{ secrets.JINA_API_KEY }}
      QDRANT__URL: http://localhost:6333
      QDRANT__COLLECTION: winston_visual
      SEARCH__RESULT_LIMIT: '3'
      SEARCH__CANDIDATE_LIMIT: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install focused API-search dependencies
        run: |
          python -m pip install \
            'httpx>=0.28.1' \
            'numpy>=2.3.0' \
            'pillow>=12.0.0' \
            'pydantic>=2.13.4' \
            'pydantic-settings>=2.15.0' \
            'qdrant-client==1.18.0'
          python -m pip install -e . --no-deps
      - name: Require Jina API secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EMBEDDING__API_KEY:-}" ]; then
            echo 'JINA_API_KEY repository secret is required for real semantic validation.' >&2
            exit 1
          fi
      - name: Start user-provided Qdrant volume
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name qdrant-search \
            -p 6333:6333 \
            -v "$PWD/volumes/qdrant:/qdrant/storage" \
            qdrant/qdrant:v1.18.2
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:6333/collections >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs qdrant-search
          exit 1
      - name: Search real indexed videos with Jina CLIP
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            'a person walking on the street'
            'a car on the road'
            'a traffic light at an intersection'
            'a bicycle or cyclist'
            'a bus or large vehicle'
            'people crossing the road'
            'a white car'
            'a red car'
          )
          for query in "${queries[@]}"; do
            echo
            echo "===== QUERY: $query ====="
            winston search "$query" --limit 3
          done
      - name: Download original release videos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/winston-release
          mkdir -p /tmp/winston-release
          gh release download test-dataset-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern videos.zip \
            --dir /tmp/winston-release
          unzip -q /tmp/winston-release/videos.zip -d /tmp/winston-release
          test -f /tmp/winston-release/videos/2026-08-22T14-00-00Z.mkv
      - name: Verify returned regions against original release frames
        run: python tmp/semantic-search-validation/verify_video_hits.py
      - name: Stop temporary Qdrant
        if: always()
        run: docker rm -f qdrant-search || true
