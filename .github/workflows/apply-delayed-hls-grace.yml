name: Apply delayed HLS grace fix

on:
  push:
    branches:
      - feat/public-stream-recorder
    paths:
      - '.github/workflows/apply-delayed-hls-grace.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-stream-recorder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch delayed HLS grace window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/stream_recorder/discovery.py')
          text = path.read_text()
          old = '''            if not streams:
              log(f"{prefix} no HLS after initial load; trying user-gesture media activation")
              # Real third-party players can explicitly require a user gesture. Try visible play
              # controls first; only use HTMLMediaElement.play() if the click path produced no HLS.
              clicked = await _click_play_controls(page, prefix, deadline)
              if clicked and not streams:
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              if not streams:
                  attempted = await _activate_video_elements(page, prefix, deadline)
                  if attempted and not streams:
                      await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
'''
          new = '''            if not streams:
              log(f"{prefix} no HLS after initial load; trying user-gesture media activation")
              # Real third-party players can explicitly require a user gesture. Try visible play
              # controls first; only use HTMLMediaElement.play() if the click path produced no HLS.
              clicked = await _click_play_controls(page, prefix, deadline)
              if clicked and not streams:
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              attempted = False
              if not streams:
                  attempted = await _activate_video_elements(page, prefix, deadline)
                  if attempted and not streams:
                      await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
              if not streams and not clicked and not attempted:
                  # Some players attach their video/control asynchronously after DOMContentLoaded.
                  # Even when there is nothing to activate yet, keep the source page alive for one
                  # bounded grace window so late network HLS requests are not missed.
                  log(f"{prefix} media controls not ready; waiting for delayed HLS initialization")
                  await _wait_for_hls_after_activation(stream_seen, deadline=deadline)
'''
          if old not in text:
              raise SystemExit('expected media activation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install project dependencies
        run: python -m pip install -e '.[script]'
      - name: Verify delayed HLS regression
        run: python -m pytest tests/scripts/stream_recorder/test_czersk_activation.py::test_browser_waits_for_delayed_hls_when_player_controls_are_not_ready -q
      - name: Verify complete stream recorder suite
        run: python -m pytest tests/scripts/stream_recorder -q
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stream_recorder/discovery.py
          git commit -m 'fix: wait for delayed player HLS initialization'
          git push origin HEAD:feat/public-stream-recorder
