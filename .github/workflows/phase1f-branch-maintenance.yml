name: Phase 1F branch maintenance

on:
  push:
    branches:
      - feat/semantic-search-cli
    paths:
      - '.github/workflows/phase1f-branch-maintenance.yml'

permissions:
  contents: write

jobs:
  align-phase1e-test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-search-cli
      - name: Make the Phase 1E batch bound explicit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/src/winston/indexing/test_pipeline.py')
          text = path.read_text()
          needle = '''    _write_media(tmp_path, "large.jpg")\n    _install_image_stubs(monkeypatch, width=100, height=100)\n    pipeline, embedder, _ = _pipeline(tmp_path)\n'''
          replacement = '''    _write_media(tmp_path, "large.jpg")\n    _install_image_stubs(monkeypatch, width=100, height=100)\n    # This test exercises an explicit orchestration bound; the application default may evolve independently.\n    monkeypatch.setenv("INDEXING__VISUAL_BATCH_SIZE", "9")\n    pipeline, embedder, _ = _pipeline(tmp_path)\n'''
          if needle not in text:
              raise SystemExit('expected Phase 1E test block not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/src/winston/indexing/test_pipeline.py
          git commit -m 'test: keep indexing batch bound explicit'
          git push origin HEAD:feat/semantic-search-cli
