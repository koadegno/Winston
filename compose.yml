services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant_vdp
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - type: bind
        source: ./volumes/qdrant
        target: /qdrant/storage
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
