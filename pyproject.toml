[project]
name = "winston"
version = "0.1.0"
description = "Find anything in video footage with natural-language search and multimodal embeddings."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
script = [
    "playwright>=1.62.0",
    "pyxlsb>=1.0.10",
]
