[project]
name = "winston"
version = "0.1.0"
description = "Find anything in video footage with natural-language search and multimodal embeddings."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "numpy>=2.3.0",
    "pillow>=12.0.0",
    "torch>=2.10.0",
    "transformers>=4.41.2,<5",
    "timm>=1.0.0",
    "einops>=0.8.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "qdrant-client>=1.18,<1.19",
]

[project.optional-dependencies]
script = [
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pyxlsb>=1.0.10",
]

[project.scripts]
winston = "winston.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
